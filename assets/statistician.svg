<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" fill="none" role="img" aria-label="A statistician working at three laptops showing scrolling numbers, a histogram with a bell curve, and a scatter plot with a regression line">
<style>
.num{font:500 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.lbl{font:500 8px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.scroll{animation:scroll 7s linear infinite}
@keyframes scroll{to{transform:translateY(-154px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
@keyframes grow{0%{transform:scaleY(.15)}45%,75%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
.curve{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 3.2s ease-in-out infinite}
@keyframes draw{0%,15%{stroke-dashoffset:260}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-260}}
.pt{opacity:0;animation:pop 4.6s ease-out infinite}
@keyframes pop{0%{opacity:0;transform:translateY(-6px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
.pt{transform-box:fill-box}
.fit{stroke-dasharray:140;stroke-dashoffset:140;animation:fit 4.6s ease-in-out infinite}
@keyframes fit{0%,55%{stroke-dashoffset:140}75%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:140}}
.fl{font:600 15px ui-serif,Georgia,serif;opacity:0;animation:float 6.3s ease-in-out infinite}
@keyframes float{0%{opacity:0;transform:translateY(16px)}20%,60%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
.cur{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.head{transform-box:fill-box;transform-origin:50% 100%;animation:nod 5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.scroll,.bar,.curve,.pt,.fit,.fl,.cur,.head{animation:none}.pt,.fl{opacity:1}.curve,.fit{stroke-dashoffset:0}}
</style>
